# Start via ./start_proxy.sh — do not call `docker compose` directly (same
# guard as DevBox's compose file).
x-require-wrapper: "${DEVBOX_PROXY_WRAPPER:?Use ./start_proxy.sh instead of calling docker compose directly}"

services:
  # Read-only, containers-only view of the Docker API. The proxy never gets
  # the raw socket, so a bug in it can't create/exec/stop containers.
  docker-socket-proxy:
    image: tecnativa/docker-socket-proxy:latest
    environment:
      CONTAINERS: 1   # GET /containers/json only; POST etc. stay off
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
    networks: [internal]
    restart: "no"

  # Runs `socat` inside a devbox so the proxy can reach servers bound to
  # 127.0.0.1 (ticket 006). Holds the raw Docker socket, so it is kept tiny
  # (stdlib only, see connector/connector.py), only reachable on `internal`,
  # and can only run that one fixed command in devbox-image containers.
  connector:
    build: .
    image: devbox-proxy
    command: ["python", "/app/connector.py"]
    user: root   # needs the docker socket
    environment:
      DEVBOX_IMAGE: ${DEVBOX_IMAGE:-my-dev-box-v2}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    networks: [internal]
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    restart: "no"

  devbox-proxy:
    build: .
    image: devbox-proxy
    container_name: devbox-proxy
    depends_on: [docker-socket-proxy, connector]
    environment:
      DOCKER_API: http://docker-socket-proxy:2375
      DEVBOX_IMAGE: ${DEVBOX_IMAGE:-my-dev-box-v2}
      CONNECTOR: connector:8081
      PUBLIC_PORT: ${PROXY_PORT:-8080}
      BASE_DOMAIN: ${BASE_DOMAIN:-localhost}
    ports:
      # Loopback unless start_proxy.sh --host sets PROXY_BIND=0.0.0.0: the
      # proxy forwards to anything in the devbox containers, so it must not
      # be reachable from the LAN by accident.
      - "${PROXY_BIND:-127.0.0.1}:${PROXY_PORT:-8080}:8080"
    networks: [internal, devbox-net]
    restart: "no"

networks:
  internal:
    internal: true
  # Shared with every devbox (see DevBox's docker-compose.yml); created by
  # start_proxy.sh / bash_in_dev_container.sh.
  devbox-net:
    external: true
    name: devbox-net
